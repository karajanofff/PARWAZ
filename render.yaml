# MIMO 5G Monitoring — Render Blueprint
# Bitta servis: API + frontend birgalikda

databases:
  - name: mimo-db
    plan: free
    region: frankfurt
    databaseName: mimo_monitoring
    user: mimo_user

services:
  - type: web
    name: mimo-api
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm ci --prefix client && npm run build --prefix client && npm ci --include=dev --prefix server && npm run prisma:generate --prefix server && npm run build --prefix server && cp -r client/dist server/public
    startCommand: npm run start:render --prefix server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: DATABASE_URL
        fromDatabase:
          name: mimo-db
          property: connectionString
      - key: CLIENT_URL
        fromService:
          type: web
          name: mimo-api
          envVarKey: RENDER_EXTERNAL_URL
