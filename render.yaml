# Render Blueprint — MIMO 5G Monitoring Platform
# Deploy: Render Dashboard → New → Blueprint → repo tanlang

databases:
  - name: parwaz-db
    plan: free
    region: frankfurt
    databaseName: mimo_monitoring
    user: mimo_user

services:
  # Backend API (Node.js + Express + Prisma)
  - type: web
    name: parwaz-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: server
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma db push && npm run prisma:seed && npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: DATABASE_URL
        fromDatabase:
          name: parwaz-db
          property: connectionString
      - key: CLIENT_URL
        fromService:
          type: web
          name: parwaz-web
          envVarKey: RENDER_EXTERNAL_URL

  # Frontend (Vite + React static site)
  - type: web
    name: parwaz-web
    runtime: static
    plan: free
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        fromService:
          type: web
          name: parwaz-api
          property: host
