# MIMO 5G Monitoring — Render Blueprint
# Deploy: Render Dashboard → New → Blueprint → karajanofff/PARWAZ

databases:
  - name: mimo-db
    plan: free
    region: frankfurt
    databaseName: mimo_monitoring
    user: mimo_user

services:
  - type: web
    name: mimo-api
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    rootDir: server
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: npm run start:render
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: DATABASE_URL
        fromDatabase:
          name: mimo-db
          property: connectionString
      - key: CLIENT_URL
        fromService:
          type: web
          name: mimo-web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: mimo-web
    runtime: static
    branch: main
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        fromService:
          type: web
          name: mimo-api
          property: host
