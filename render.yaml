# Render Blueprint — AI Ámeliy Tekseriw Platforması
# Deploy: Render Dashboard → New → Blueprint → repo tanla

databases:
  - name: parwaz-db
    plan: free
    databaseName: parwaz
    user: parwaz

services:
  - type: web
    name: parwaz-platform
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: parwaz-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
